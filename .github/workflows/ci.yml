name: validate-project
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated data against source
        run: python3 scripts/build_content.py --check
      - name: Validate repository and links
        run: python3 scripts/check.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JS syntax
        run: |
          node --check assets/app.js
          node --check assets/sources.js
      - name: Test original source ledger and exporter
        run: node tests/test_sources.cjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run responsive browser regression
        run: python scripts/browser_smoke.py
